name: Sync vocabulary from verbformen.de

on:
  schedule:
    # Runs daily at 03:17 UTC (10:17 Jakarta) and 15:17 UTC (22:17 Jakarta). The script itself decides whether anything is due:
    # words are re-checked every 7 days, switching to every 30 days after the date in config.json.
    # A big first crawl spreads itself over several days automatically.
    - cron: "17 3 * * *"
    # A second daily run while the big A1–C2 crawl is going. Same polite speed (about 12 requests a
    # minute); it just gets through the list in half the days. Remove this line once the crawl is done.
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-check every word now (ignore the schedule)"
        type: boolean
        default: false
      limit:
        description: "Test run: fetch at most N word pages (empty = no limit)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vocab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      PYTHONUNBUFFERED: "1"   # show progress in the log as it happens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parser tests
        run: python -m pytest -q

      - name: Canary (stop if the site layout changed)
        run: python -m scraper.canary

      - name: Health check, part 1 (queue words missing from data/)
        run: python -m scraper.health --local-only

      - name: Sync
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m scraper.sync $ARGS

      - name: Upload to Supabase (skipped if secrets are not set)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.supabase_upload

      - name: Health check, part 2 (compare source / local / Supabase, repair, record)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.health

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data archive
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            VERSION=$(python -c "import json;print(json.load(open('data/meta.json'))['data_version'])")
            git commit -m "Vocabulary sync $(date -u +%F) (data version $VERSION)"
            # If the code changed on main while this run was going, put the data commit on top of it.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 10
            done
          fi
